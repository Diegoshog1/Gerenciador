name: Vidro (APK da Google TV)

on:
  push:
    paths:
      - "tv-launcher/**"
      - ".github/workflows/tv-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compilar APK
        run: gradle -p tv-launcher assembleRelease --no-daemon
      - name: Renomear
        run: cp tv-launcher/app/build/outputs/apk/release/app-release.apk Vidro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vidro-apk
          path: Vidro.apk
      - name: Publicar APK na branch vidro-apk
        run: |
          mkdir out && cp Vidro.apk out/ && cd out
          git init -q -b vidro-apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Vidro.apk && git commit -qm "Vidro.apk de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" vidro-apk
