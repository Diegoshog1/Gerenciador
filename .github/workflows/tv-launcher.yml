name: Vidro (APK da Google TV)

on:
  push:
    paths:
      - "tv-launcher/**"
      - ".github/workflows/tv-launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compilar APK
        run: gradle -p tv-launcher assembleRelease --no-daemon
      - name: Renomear
        run: cp tv-launcher/app/build/outputs/apk/release/app-release.apk Vidro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vidro-apk
          path: Vidro.apk
